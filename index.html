<body>
 <header>
  <div id = "page-title">
    <h1>Meet Empress of Light</h1>
    <p id = "quip">Grand sovereign of the hallowed</p>
  <!-- your h1 title with id="page-title" -->
  <!-- a short tagline -->
  </div>
</header>

<main>

  <div class="card profile-card">
    <img src="images/Empress_of_Light.gif" alt="Empress of Light" class="profile-img">
    <!-- your picture with class="profile-img" -->
    <h3 class="subheading">Name</h3>
    <!-- your name -->
     <p>Empress of Light</p>
  </div>

  <div class="card about">
    <h3 class="subheading">About</h3>
    <p>Empress of Light is a god who lives in a dimension above ours.<br>
       She only descends when her prismatic lacewings are killed to deliver vengeance.</p>
    <!-- a few sentences, with one phrase in a span -->

    <h3 class="subheading">Favorites</h3>
    <div class="tag">Prismatic Lacewings
      <img src = "images/p_lace.jpeg" alt="Prismatic Lacewing" id = "lacewing">
    </div>
    <!-- at least 3 favorites, each in a div with class="tag" -->
  </div>

  <div class="card contact">
    <h3 class="subheading">Contact</h3>
    <!-- fake address, phone link, and email link, see the doc -->
  </div>

</main>

<footer>
  <p>2026 Empress of Light</p>
  <!-- your name and the year or contact and trademark/ logo -->
</footer>
   
</body>
</html>
